name: Apply CodeCompanion v3.6.0 release patch

on:
  push:
    paths:
      - codex-v3.6.0.patch.b64

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested patch and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base64 --decode codex-v3.6.0.patch.b64 > /tmp/codex-v3.6.0.patch
          git apply --index /tmp/codex-v3.6.0.patch
          git rm codex-v3.6.0.patch.b64 .github/workflows/apply-codecompanion-v360.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add needs-you inbox and three-device status lights (v3.6.0)"
          git push origin HEAD:main

          release_sha="$(git rev-parse HEAD)"
          cat > /tmp/codecompanion-v360-release.md <<'EOF'
          # 码伴 v3.6.0 — “需要你”收件箱与三端状态灯

          Mac、iPhone 与 Apple Watch 现在共用一套状态优先级：

          - 🔴 **需要你**：待审批、待回复
          - 🟠 **需要查看**：停滞、中断或连接失败
          - 🔵 **运行中**：任务仍在执行
          - 🟢 **空闲**：当前没有待处理任务

          Mac 菜单栏显示状态点并列出前三项；iPhone 与 Apple Watch 增加状态卡和按优先级排列的收件箱。审批详情与远程 Token 不进入 Mac 的本机只读状态快照。

          ![v3.6.0 三端状态灯与需要你收件箱](https://raw.githubusercontent.com/keeencra/codex-quota-watch-plus/v3.6.0/docs/assets/v3.6.0-needs-you.svg)

          功能示意图，虚构数据，非实机截图。

          ## 验证

          - Python 196 项、共享 Swift 89 项回归通过
          - Mac 检查、构建、签名与 App Group 校验通过
          - iPhone 与 watchOS 无签名模拟器构建通过
          - 用户已在 Mac、iPhone 和 Apple Watch 上验收状态卡与收件箱显示正常

          ## 升级

          使用现有配对和配置更新 Mac、iPhone 与 Apple Watch 即可。应用数据格式、移动端配对协议和最低系统版本未改变。

          完整说明见 [CHANGELOG.md](https://github.com/keeencra/codex-quota-watch-plus/blob/v3.6.0/CHANGELOG.md#v360--小更新--2026-11-22--第-25-次迭代--需要你收件箱与三端状态灯)。
          EOF

          gh release create v3.6.0 \
            --target "${release_sha}" \
            --title "v3.6.0 — “需要你”收件箱与三端状态灯" \
            --notes-file /tmp/codecompanion-v360-release.md

          gh api --method PATCH repos/keeencra/codex-quota-watch-plus \
            -f description="码伴 · CodeCompanion：在 Mac、iPhone 与 Apple Watch 查看 Codex 额度、任务进度，并通过状态灯判断何时需要处理。"
