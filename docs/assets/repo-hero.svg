<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota Watch Plus：任务、审批、额度，一眼掌握</title>
  <desc id="desc">独立绘制的功能示意图。手机和手表分别展示蓝色运行中、橙色待审批及绿色剩余额度卡片。所有数字均为演示数据。</desc>
  <defs>
