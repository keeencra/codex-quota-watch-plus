    <linearGradient id="rim" x2="1" y2="1"><stop stop-color="#72818d"/><stop offset=".45" stop-color="#283541"/><stop offset="1" stop-color="#52616c"/></linearGradient>
  </defs>
  <rect width="1280" height="580" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
