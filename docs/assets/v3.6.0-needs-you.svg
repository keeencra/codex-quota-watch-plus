<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">码伴 v3.6.0 三端状态灯与需要你收件箱</title>
  <desc id="desc">Mac、iPhone 和 Apple Watch 使用红、橙、蓝、绿四色状态灯展示待审批、异常、运行中和空闲状态。功能示意图，虚构数据，非实机截图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#101b32"/>
      <stop offset="1" stop-color="#18213a"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202b45"/>
      <stop offset="1" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202c49"/>
      <stop offset="1" stop-color="#182239"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .kicker { font-size: 22px; font-weight: 650; letter-spacing: 3px; fill: #8ea0c7; }
      .title { font-size: 54px; font-weight: 760; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font-size: 24px; fill: #bdc9e4; }
      .fine { font-size: 17px; fill: #8493b3; }
      .label { font-size: 18px; font-weight: 650; fill: #b9c6e4; }
      .headline { font-size: 24px; font-weight: 740; fill: #ffffff; }
      .body { font-size: 18px; fill: #d5def2; }
      .secondary { font-size: 15px; fill: #8f9dbd; }
      .count { font-size: 31px; font-weight: 780; fill: #ffffff; }
      .mono { font-family: "SF Mono", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="110" r="250" fill="#2859d9" opacity="0.08"/>
  <circle cx="120" cy="790" r="260" fill="#19c6a3" opacity="0.06"/>

  <text class="kicker" x="80" y="76">CODECOMPANION · V3.6.0</text>
  <text class="title" x="80" y="142">三端状态灯，一眼知道何时需要你</text>
  <text class="subtitle" x="80" y="188">三端共用同一套优先级；待审批、待回复与异常任务集中排列。</text>
  <text class="fine" x="80" y="220">功能示意图 · 虚构数据 · 非实机截图</text>
  <text class="label" x="309" y="254" text-anchor="middle" fill="#ffffff">Mac 菜单栏 · 圆环状态点 + 优先列表</text>
  <text class="label" x="770" y="254" text-anchor="middle" fill="#ffffff">iPhone · 状态卡 + 收件箱</text>
  <text class="label" x="1295" y="254" text-anchor="middle" fill="#ffffff">Apple Watch · 同一优先级</text>

  <g filter="url(#shadow)">
    <rect x="72" y="270" width="474" height="510" rx="34" fill="url(#device)" stroke="#334362" stroke-width="2"/>
    <rect x="92" y="290" width="434" height="470" rx="25" fill="#0c1322"/>
    <circle cx="123" cy="321" r="17" fill="none" stroke="#5bd6ef" stroke-width="5"/>
    <circle cx="123" cy="321" r="6" fill="#ffffff"/>
    <circle cx="137" cy="307" r="7" fill="#ff5a67" stroke="#0c1322" stroke-width="3" filter="url(#glow)"/>
    <text class="body mono" x="151" y="326" style="font-weight:700">Codex 25%</text>
    <rect x="112" y="357" width="394" height="376" rx="22" fill="url(#card)" stroke="#31415f"/>
    <text class="label" x="136" y="393">现在</text>
    <text class="headline" x="136" y="430">需要你</text>
    <text class="count" x="470" y="430" text-anchor="end">2</text>
    <circle cx="146" cy="465" r="8" fill="#ff5a67" filter="url(#glow)"/>
    <text class="body" x="168" y="472">等待确认 · 发布工具</text>
    <text class="secondary" x="168" y="500">核对完整操作后批准或拒绝</text>
    <circle cx="146" cy="540" r="8" fill="#ff5a67" filter="url(#glow)"/>
    <text class="body" x="168" y="547">等待回复 · 频道配置</text>
    <text class="secondary" x="168" y="575">回答后任务会继续运行</text>
    <circle cx="146" cy="615" r="8" fill="#ffad4d" filter="url(#glow)"/>
    <text class="body" x="168" y="622">需要查看 · 旧任务状态</text>
    <text class="secondary" x="168" y="650">停滞或中断不会静默消失</text>
    <rect x="136" y="681" width="346" height="1" fill="#31415f"/>
    <text class="secondary" x="136" y="710">状态每 10 秒从本机只读快照更新</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="585" y="270" width="370" height="545" rx="54" fill="#080d17" stroke="#3a4864" stroke-width="3"/>
    <rect x="602" y="287" width="336" height="511" rx="43" fill="#111a2d"/>
    <rect x="730" y="300" width="80" height="21" rx="11" fill="#070b13"/>
    <text class="label" x="629" y="359">码伴</text>
    <text class="secondary" x="911" y="359" text-anchor="end">17:28</text>
    <rect x="625" y="385" width="290" height="112" rx="24" fill="#38202b" stroke="#614052"/>
    <circle cx="655" cy="420" r="12" fill="#ff5a67" filter="url(#glow)"/>
    <text class="headline" x="679" y="427">需要你</text>
    <text class="count" x="889" y="429" text-anchor="end">2</text>
    <text class="secondary" x="679" y="458" fill="#e5aeb5">1 待审批 · 1 待回复 · 1 运行中</text>
    <text class="body" x="679" y="483" fill="#ff8b94">点击进入按优先级排列的收件箱</text>

    <text class="label" x="625" y="532">按优先级排列</text>
    <rect x="625" y="548" width="290" height="72" rx="18" fill="url(#card)" stroke="#2c3a56"/>
    <circle cx="647" cy="577" r="7" fill="#ff5a67"/>
    <text class="body" x="667" y="582" style="font-weight:650">发布到 GitHub</text>
    <text class="secondary" x="667" y="604">等待确认 · 项目</text>
    <rect x="625" y="628" width="290" height="72" rx="18" fill="url(#card)" stroke="#2c3a56"/>
    <circle cx="647" cy="657" r="7" fill="#ff5a67"/>
    <text class="body" x="667" y="662" style="font-weight:650">回答架构问题</text>
    <text class="secondary" x="667" y="684">等待回复 · 副业</text>
    <rect x="625" y="708" width="290" height="72" rx="18" fill="url(#card)" stroke="#2c3a56"/>
    <circle cx="647" cy="737" r="7" fill="#5bd6ef"/>
    <text class="body" x="667" y="742" style="font-weight:650">整理发布说明</text>
    <text class="secondary" x="667" y="764">运行中 · 项目</text>
    <text class="fine" x="770" y="793" text-anchor="middle">已完成与归档任务不会进入</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1100" y="300" width="390" height="474" rx="96" fill="#080d16" stroke="#3a4864" stroke-width="3"/>
    <rect x="1117" y="317" width="356" height="440" rx="82" fill="url(#device)"/>
    <rect x="1140" y="346" width="310" height="84" rx="28" fill="#38202b" stroke="#614052"/>
    <circle cx="1172" cy="383" r="10" fill="#ff5a67" filter="url(#glow)"/>
    <text class="headline" x="1194" y="392">需要你</text>
    <text class="count" x="1421" y="393" text-anchor="end">2</text>
    <text class="secondary" x="1194" y="416" fill="#e5aeb5">1 待审批 · 1 待回复</text>

    <rect x="1140" y="449" width="310" height="82" rx="23" fill="url(#card)" stroke="#2d3c59"/>
    <circle cx="1165" cy="478" r="7" fill="#ff5a67"/>
    <text class="body" x="1184" y="484" style="font-weight:650">发布到 GitHub</text>
    <text class="secondary" x="1184" y="510">等待确认 · 项目</text>

    <rect x="1140" y="544" width="310" height="82" rx="23" fill="url(#card)" stroke="#2d3c59"/>
    <circle cx="1165" cy="573" r="7" fill="#ff5a67"/>
    <text class="body" x="1184" y="579" style="font-weight:650">回答架构问题</text>
    <text class="secondary" x="1184" y="605">等待回复 · 副业</text>

    <rect x="1140" y="639" width="310" height="82" rx="23" fill="url(#card)" stroke="#2d3c59"/>
    <circle cx="1165" cy="668" r="7" fill="#5bd6ef"/>
    <text class="body" x="1184" y="674" style="font-weight:650">整理发布说明</text>
    <text class="secondary" x="1184" y="700">运行中 · 项目</text>
  </g>
  <g transform="translate(112, 866)">
    <circle cx="0" cy="-6" r="7" fill="#ff5a67"/><text class="secondary" x="16" y="0">需要你</text>
    <circle cx="118" cy="-6" r="7" fill="#ffad4d"/><text class="secondary" x="134" y="0">需要查看</text>
    <circle cx="256" cy="-6" r="7" fill="#5bd6ef"/><text class="secondary" x="272" y="0">运行中</text>
    <circle cx="358" cy="-6" r="7" fill="#48d597"/><text class="secondary" x="374" y="0">空闲</text>
  </g>
  <text class="fine" x="1518" y="866" text-anchor="end">审批详情与远程 Token 不进入 Mac 状态快照</text>
</svg>
