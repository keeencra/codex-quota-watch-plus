<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>01  首页保留三页，功能页各自独立</title><desc>对比旧版功能页仍附带额度和今日用量分页，与新版首页三页滑动、功能页独立返回的导航行为。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#152238}.muted{fill:#526277}.white{fill:white}.small{font-size:18px}.body{font-size:24px}.bold{font-weight:700}</style><rect width="1200" height="680" rx="24" fill="#f3f6fb"/><text x="44" y="62" font-size="34" class="bold">01  首页保留三页，功能页各自独立</text><text x="44" y="97" class="small muted">Codex Quota Watch Plus · v1.0.0 → v2.0.0 · 行为示意，非设备截图</text><rect x="32" y="126" width="555" height="460" rx="16" fill="white" stroke="none"/><rect x="613" y="126" width="555" height="460" rx="16" fill="white" stroke="none"/><text x="58" y="165" class="body bold" style="fill:#ba3c41">改动前</text><text x="639" y="165" class="body bold" style="fill:#14784b">改动后</text><text x="58" y="206" class="small muted">进入任意功能后，仍附带首页分页</text><text x="639" y="206" class="small muted">首页滑动切换；进入功能后不再分页</text><rect x="58" y="232" width="153" height="57" rx="16" fill="#e8eef7" stroke="none"/><text x="78" y="269" class="body">总览</text><rect x="225" y="232" width="153" height="57" rx="16" fill="#e8eef7" stroke="none"/><text x="245" y="269" class="body">额度</text><rect x="392" y="232" width="153" height="57" rx="16" fill="#e8eef7" stroke="none"/><text x="412" y="269" class="body">今日用量</text><rect x="639" y="232" width="153" height="57" rx="16" fill="#e8eef7" stroke="none"/><text x="659" y="269" class="body">总览</text><rect x="806" y="232" width="153" height="57" rx="16" fill="#e8eef7" stroke="none"/><text x="826" y="269" class="body">额度</text><rect x="973" y="232" width="153" height="57" rx="16" fill="#e8eef7" stroke="none"/><text x="993" y="269" class="body">今日用量</text><text x="85" y="326" class="small muted">点击总览中的任务 / 审批 / 额度</text><text x="666" y="326" class="small muted">点击总览中的任务 / 审批 / 额度</text><text x="300" y="360" class="body">↓</text><text x="883" y="360" class="body">↓</text><rect x="58" y="380" width="153" height="82" rx="16" fill="#fff0ef" stroke="#eeb5b5"/><text x="75" y="429" class="body">当前功能</text><rect x="225" y="380" width="153" height="82" rx="16" fill="#fff0ef" stroke="#eeb5b5"/><text x="242" y="429" class="body">额度</text><rect x="392" y="380" width="153" height="82" rx="16" fill="#fff0ef" stroke="#eeb5b5"/><text x="409" y="429" class="body">今日用量</text><rect x="665" y="380" width="451" height="82" rx="16" fill="#e8f6ed" stroke="#abd5b9"/><text x="691" y="430" class="body">‹ 返回        当前功能的独立页面</text><text x="72" y="511" class="small" style="fill:#ba3c41">问题：看任务时，也能滑到重复内容</text><text x="653" y="511" class="small" style="fill:#14784b">返回上一页；首页三页不放返回按钮</text><text x="44" y="626" class="body bold">保留：总览 / 额度 / 今日用量    ·    调整：分页只出现在首页</text></svg>